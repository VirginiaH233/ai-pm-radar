name: Radar Daily

on:
  schedule:
    # UTC 01:20 = 北京时间 09:20（对齐原日报触发时间）
    - cron: '20 1 * * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 commit 运行日志回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install feedparser pyyaml

      - name: Run daily pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/pipeline.py

      - name: Commit run log
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add logs/runs.jsonl
          git commit -m "chore: 运行日志 $(date -u +%Y-%m-%d)" || echo "无新日志"
          git push || echo "push 失败（无权限或非 fast-forward）"

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: radar-daily
          path: output/*.md
